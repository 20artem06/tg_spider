name = "tg-spider"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Ежедневное напоминание в 18:00 UTC (21:00 МСК)
# и подведение итогов недели в 19:00 UTC по воскресеньям (22:00 МСК)
[triggers]
crons = ["0 18 * * *", "0 19 * * 0"]

# KV-namespace "tg-spider" в дашборде Cloudflare (Storage & databases -> Workers KV).
[[kv_namespaces]]
binding = "STATE"
id = "2a83d0c0fa514991acbd8ef7071551e4"
